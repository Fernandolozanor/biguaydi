<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0f2921"/>
      <stop offset="60%" stop-color="#071411"/>
      <stop offset="100%" stop-color="#030806"/>
    </radialGradient>
    
    <!-- Neon Electric Lime / Cyan Gradient for B -->
    <linearGradient id="neonLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2ff85"/>
      <stop offset="50%" stop-color="#c7f36b"/>
      <stop offset="100%" stop-color="#4ce0d2"/>
    </linearGradient>

    <!-- Metallic Edge Glow -->
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#c7f36b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4ce0d2" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Electric Lightning Accent -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7f36b"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle App Icon Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#strokeGrad)" stroke-width="4"/>

  <!-- Subtle High-Tech Circuit Rings -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#1b382d" stroke-width="2" stroke-dasharray="8 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="215" fill="none" stroke="#254d3e" stroke-width="1.5" stroke-dasharray="16 24" opacity="0.4"/>

  <!-- High-Tech Stylized "B" with Aerodynamic Dolphin/Electric Curves -->
  <g filter="url(#neonGlow)">
    <!-- Main "B" Spine and Loops -->
    <path d="M 155 110 
             L 285 110 
             C 355 110 395 145 395 200 
             C 395 235 372 260 338 272 
             C 382 284 410 316 410 362 
             C 410 422 360 462 280 462 
             L 155 462 
             C 142 462 132 452 132 439 
             L 132 133 
             C 132 120 142 110 155 110 Z
             M 210 178 
             L 210 248 
             L 275 248 
             C 310 248 330 232 330 213 
             C 330 194 310 178 275 178 Z
             M 210 312 
             L 210 394 
             L 282 394 
             C 322 394 345 374 345 353 
             C 345 332 322 312 282 312 Z" 
          fill="url(#neonLime)"/>
    
    <!-- Central Lightning Slash cut-through in the "B" waist -->
    <polygon points="208,272 326,248 290,285 348,278 220,314 246,282" fill="url(#boltGrad)" opacity="0.95"/>
  </g>

  <!-- Cyan Energy Pulse Dot -->
  <circle cx="360" cy="140" r="14" fill="#4ce0d2" filter="url(#neonGlow)"/>
  <circle cx="360" cy="140" r="7" fill="#ffffff"/>
</svg>
